<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสมาชิก (User Account)</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    h1 { text-align: center; color: #2c3e50; }
    h2 { border-bottom: 2px solid #3498db; padding-bottom: 6px; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
    section { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 9px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
    button { margin-top: 16px; padding: 10px 18px; background: #3498db; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; }
    button:hover { background: #2980b9; }
    .delete-btn { background: #e74c3c; padding: 5px 12px; font-size: 13px; }
    .delete-btn:hover { background: #c0392b; }
    #refreshBtn { background: #27ae60; }
    #refreshBtn:hover { background: #219150; }
    #message { max-width: 900px; margin: 0 auto 20px; padding: 12px 16px; border-radius: 6px; display: none; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .table-wrap { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    th { background: #ecf0f1; }
    tr:hover td { background: #f9f9f9; }
    #currentUser { text-align: center; margin-bottom: 14px; font-weight: 600; color: #8e44ad; min-height: 22px; }
  </style>
</head>
<body>
  <h1>ระบบสมาชิก (User Account)</h1>
  <div id="message"></div>
  <div id="currentUser"></div>

  <div class="container">
    <section>
      <h2>สมัครสมาชิก</h2>
      <form id="registerForm">
        <label for="regUsername">Username</label>
        <input type="text" id="regUsername" name="username" minlength="3" required>
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" name="email" required>
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" name="password" minlength="6" required>
        <button type="submit">สมัครสมาชิก</button>
      </form>
    </section>

    <section>
      <h2>เข้าสู่ระบบ</h2>
      <form id="loginForm">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" name="username" required>
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" required>
        <button type="submit">เข้าสู่ระบบ</button>
      </form>
    </section>
  </div>

  <div class="table-wrap">
    <h2>รายชื่อสมาชิก</h2>
    <button id="refreshBtn" type="button">รีเฟรชรายการ</button>
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>จำนวนครั้งที่เข้าสู่ระบบ</th>
          <th>เข้าสู่ระบบล่าสุด</th>
          <th>วันที่สมัคร</th>
          <th>จัดการ</th>
        </tr>
      </thead>
      <tbody id="usersTable"></tbody>
    </table>
  </div>

  <script src="/script.js"></script>
</body>
</html>
